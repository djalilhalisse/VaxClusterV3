# Internal folders and file types must never be downloadable.
<DirectoryMatch "^/var/www/html/(configuration|includes|predictions|models|docker|tools)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(md|sql|pkl|py|sh|ya?ml)$|^(Dockerfile|requirements\.txt|\.dockerignore)$)">
    Require all denied
</FilesMatch>
ServerTokens Prod
ServerSignature Off

# Speed: compress text and let browsers cache static files (CSS/JS URLs are versioned by the app).
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript image/svg+xml application/json
</IfModule>
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 hour"
    ExpiresByType text/javascript "access plus 1 hour"
    ExpiresByType application/javascript "access plus 1 hour"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
</IfModule>
