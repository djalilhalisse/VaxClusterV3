# Optional: Render "Blueprint". Secrets (marked sync: false) are asked for in the dashboard, never stored in Git.
services:
  - type: web
    name: vaxcluster
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: Covid
      - key: DB_SSL
        value: "1"
